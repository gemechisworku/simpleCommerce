version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: simplecommerce_db
    environment:
      POSTGRES_USER: ${DB_USER:-simplecommerce}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-simplecommerce}
      POSTGRES_DB: ${DB_NAME:-simplecommerce}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/app/migrations:/migrations
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-simplecommerce}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - simplecommerce_network

  # MinIO Object Storage
  minio:
    image: minio/minio:latest
    container_name: simplecommerce_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - simplecommerce_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: simplecommerce_backend
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-simplecommerce}:${DB_PASSWORD:-simplecommerce}@db:5432/${DB_NAME:-simplecommerce}
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_ROOT_PASSWORD:-minioadmin}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_ACCESS_TOKEN_EXPIRE_MINUTES=15
      - JWT_REFRESH_TOKEN_EXPIRE_DAYS=7
      - ENVIRONMENT=${ENVIRONMENT:-development}
    volumes:
      - ./backend:/app
      - ./backend/app/migrations:/app/migrations
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - simplecommerce_network

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: simplecommerce_frontend
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8000/api/v1}
      - HOST=0.0.0.0
      - PORT=3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    depends_on:
      - backend
    networks:
      - simplecommerce_network

  # Nginx Reverse Proxy (Production)
  nginx:
    image: nginx:alpine
    container_name: simplecommerce_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      - frontend
      - backend
    networks:
      - simplecommerce_network
    profiles:
      - production

volumes:
  postgres_data:
  minio_data:

networks:
  simplecommerce_network:
    driver: bridge

